[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
rust-version = "1.89.0"
edition = "2024"
version = "0.0.0"

[workspace.dependencies]
cc = { version = "1.4", features = ["parallel"] }
criterion = "0.8.2"
cmake = "0.1.58"
futures = "0.3.34"
half = "2.7"
libc = "0.2.189"
memchr = "2.8"
mimalloc-safe = { version = "0.1" }
parquet = { version = "60.0", features = ["arrow"] }
rand = "0.10.2"
rustfft = "6.4.1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
thiserror = "2.0.20"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "json"] }
tokenizers = { version = "0.23.1", default-features = false, features = ["onig", "progressbar"] }
minijinja = { version = "3.0", features = ["json", "preserve_order", "serde"] }
uuid = { version = "1.26", features = ["v4"] }
regex = "1.13"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
unicode-width = "0.2.2"
unicode-ident = "1.0.24"
unicode-normalization = "0.1.25"
rust_xlsxwriter = "0.102.0"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
base64 = "0.22"
base64-simd = "0.8.0"
bigdecimal = "0.4.11"
fancy-regex = "0.20.2"
llguidance = { version = "1.9.1", default-features = false, features = ["lark", "rayon", "jsonschema_validation"] }
toktrie = "1.9.1"

# NAPI-RS
napi = { version = "3.12", features = ["napi10", "async", "tokio_fs", "serde-json"] }
napi-derive = "3.6"
napi-build = "2.4"

# Workspace packages
mlx-sys = { path = "crates/mlx-sys" }
mlx-paged-attn = { path = "crates/mlx-paged-attn" }
mlx-db = { path = "crates/mlx-db" }
mlx-tts = { path = "crates/mlx-tts" }
mlx-audio = { path = "crates/mlx-audio" }
mlx-clairic = { path = "crates/mlx-clairic" }

[profile.release]
lto = true
codegen-units = 1

# The test suite's cost is host-side f64 reference loops and synthetic weight
# generation (K-quant parity gates, int8 SDPA references, retention
# simulations), not GPU work: the MLX C++ side is always built Release. At
# opt-level 0 those loops dominate CI; at opt-level 2 compiling mlx-core's
# ~858k LOC (`--lib` incl. ~391k test LOC) burns ~1017 CPU-s (~18-25 min on a
# 3-vCPU macOS runner). Using opt-level 1 for workspace crates while keeping
# cached third-party dependencies at opt-level 2 cuts mlx-core --lib compile
# CPU time nearly in half (1017s -> 531s) for only a few seconds on the trimmed
# hot tests. Debug assertions and overflow checks stay on (inherited from `dev`).
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 2
