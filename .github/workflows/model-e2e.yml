name: Model E2E

# Heavy real-model end-to-end tests: each matrix leg downloads + converts the
# SMALLEST checkpoint for one model family, then runs that family's #[ignore]'d,
# self-referential tests (paged==flat byte parity, reset/replay determinism,
# session warm-reuse, greedy MTP==AR). These assert WITHIN a single run, so they
# need no host-specific golden and are CI-robust.
#
# This is deliberately split out of the per-PR `ci.yml` (which stays fast and
# model-light) because every leg pulls a real checkpoint and runs GPU inference.
#
# Triggers (heavy → opt-in only):
#   * push to `main`                  — validate after merge
#   * a pull request labeled `model-e2e` — opt-in heavy run on one PR
#   * manual `workflow_dispatch`      — available once this file is on `main`
#
# Excluded families:
#   * qwen3_5 MoE — smallest published checkpoint is 35B-A3B (~70GB); there is
#     no small option, and it would not fit a standard macOS runner's RAM.
#   * gemma4 uses `google/gemma-4-E2B-it` (HF-gated; CI's HUGGINGFACE_TOKEN has
#     access). It is the heaviest leg; if it OOMs the 7GB standard runner, move
#     just that leg to a larger `macos-*-xlarge` runner or convert it quantized.

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1

concurrency:
  group: model-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    # main pushes and manual dispatch always run; PRs run only when carrying the
    # `model-e2e` label.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'model-e2e')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin
          cache: false
          rustflags: ''

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v1-rust

      - name: Configure GitHub token for CMake downloads
        run: |
          echo "machine github.com login x-access-token password ${{ secrets.GITHUB_TOKEN }}" >> ~/.netrc
          echo "machine objects.githubusercontent.com login x-access-token password ${{ secrets.GITHUB_TOKEN }}" >> ~/.netrc
          chmod 600 ~/.netrc

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build native module
        run: yarn build
        env:
          CARGO_INCREMENTAL: 1

      - uses: actions/upload-artifact@v6
        with:
          name: mlx-node
          path: packages/core/*.node
      - uses: actions/upload-artifact@v6
        with:
          name: mlx-metallib
          path: |
            packages/core/mlx.metallib
            packages/core/paged_attn.metallib

  model-test:
    name: ${{ matrix.name }}
    needs: build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qwen3
            model: Qwen/Qwen3-0.6B
            slug: qwen3-0.6b
            mtype: ''
            env: MLX_TEST_MODEL_PATH
            tests: --test qwen3_paged_vs_flat_parity
          - name: qwen3_5-dense
            model: Qwen/Qwen3.5-0.8B
            slug: qwen3.5-0.8b
            mtype: qwen3_5
            env: MLX_TEST_MODEL_PATH
            tests: >-
              --test qwen3_5_paged_vs_flat_parity
              --test qwen3_5_session
              --test qwen3_5_delta_chat
              --test p2_paged_thinking_honors_enable
          - name: lfm2
            model: LiquidAI/LFM2-1.2B
            slug: lfm2-1.2b
            mtype: lfm2
            env: MLX_TEST_MODEL_PATH MLX_TEST_LFM2_MODEL_PATH
            tests: >-
              --test lfm2_paged_vs_flat_parity
              --test lfm2_session
          - name: gemma4
            model: google/gemma-4-E2B-it
            slug: gemma-4-e2b
            mtype: gemma4
            env: MLX_TEST_MODEL_PATH MLX_TEST_GEMMA4_MODEL_PATH
            tests: >-
              --test gemma4_paged_vs_flat_parity
              --test gemma4_session
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin
          cache: false
          rustflags: ''

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v1-rust

      - name: Configure GitHub token for CMake downloads
        run: |
          echo "machine github.com login x-access-token password ${{ secrets.GITHUB_TOKEN }}" >> ~/.netrc
          echo "machine objects.githubusercontent.com login x-access-token password ${{ secrets.GITHUB_TOKEN }}" >> ~/.netrc
          chmod 600 ~/.netrc

      - name: Install dependencies
        run: yarn install --immutable

      - uses: actions/download-artifact@v7
        with:
          name: mlx-node
          path: packages/core/
      - uses: actions/download-artifact@v7
        with:
          name: mlx-metallib
          path: packages/core/

      - name: Download + convert ${{ matrix.name }} checkpoint and run its tests
        env:
          RUST_BACKTRACE: 1
          CARGO_INCREMENTAL: 1
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          set -euo pipefail
          src=".cache/models/${{ matrix.slug }}"
          out=".cache/models/${{ matrix.slug }}-mlx-bf16"
          yarn mlx download model -m "${{ matrix.model }}" --output "$src"
          if [ -n "${{ matrix.mtype }}" ]; then
            yarn mlx convert --input "$src" -d bf16 -m "${{ matrix.mtype }}" --output "$out"
          else
            yarn mlx convert --input "$src" -d bf16 --output "$out"
          fi
          ckpt="$PWD/$out"
          # Point this family's gating env var(s) at the converted checkpoint so
          # the #[ignore]'d tests un-skip; `-- --ignored` runs only those.
          for v in ${{ matrix.env }}; do export "$v=$ckpt"; done
          cargo test -p mlx-core ${{ matrix.tests }} -- --ignored --nocapture
