name: Desktop Release

# Signing cannot live in ci.yml's `publish` job: that one runs on ubuntu-latest,
# while codesign/notarytool/stapler are macOS-only and Authenticode signing runs
# on Windows. This is a separate workflow rather than jobs in ci.yml because it
# needs Apple and SSL.com signing secrets that no PR-triggered job should ever
# be able to read. `windows` and `macos` build and sign in parallel; `publish`
# (`ubuntu-latest`) downloads and verifies all assets, publishes the GitHub
# Release, and bumps the Homebrew cask; `winget` submits the WinGet update.
#
# `dry_run` builds, packages and signs but does NOT notarize or publish. That path
# needs only CSC_LINK + CSC_KEY_PASSWORD, so the pipeline is exercisable before the
# notarization secrets exist — which matters, because notarization is the step with
# the slowest feedback loop and the least reproducible failures.
#
# Required secrets (stored in the protected `desktop-release` GitHub Environment,
# restricted to `v*` tags and `main` so feature/PR branches cannot read them):
#   CSC_LINK                     base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD             its export password
#   APPLE_TEAM_ID                10-char Team ID
#   APPLE_API_KEY_P8             base64 of the App Store Connect API .p8
#   APPLE_API_KEY_ID             10-char Key ID shown beside the key
#   APPLE_API_ISSUER_ID          UUID at the top of the Keys page
# Optional:
#   HOMEBREW_TAP_TOKEN           PAT with contents:write on the tap repo
#   WINGET_TOKEN                 PAT with public_repo scope for winget-pkgs PRs
#   ES_USERNAME                  SSL.com account user name    } Windows Authenticode
#   ES_PASSWORD                  SSL.com account password     } signing via pinned
#   CREDENTIAL_ID                eSigner credential ID        } SSL.com CodeSignTool
#   ES_TOTP_SECRET               eSigner TOTP secret          } v1.3.2 (eSigner).
#                                All four, or none: without them the Windows ZIP
#                                ships unsigned, with a warning, exactly as before.
#
# Notarization authenticates with an App Store Connect API key rather than
# `--apple-id` + an app-specific password. The key belongs to the organization
# instead of to a person, so it does not break when someone leaves or rotates
# their Apple ID password, it carries no 2FA coupling, and it can be revoked on
# its own without disturbing anything else. The two are alternatives for the
# NOTARY only — signing still needs the Developer ID Application certificate in
# CSC_LINK, which nothing here can replace.

on:
  # Published releases are already visible to updater clients. Build from the
  # tag and keep the release in draft until every required asset is attached.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign, but skip notarization and publishing'
        type: boolean
        default: true
      # Dry runs can validate a planned tag before it exists. Publishing requires
      # an existing tag and checks out that exact ref, regardless of the UI branch.
      release_tag:
        description: 'Release tag, e.g. v0.0.14 (required to publish; optional for a dry run)'
        type: string
        default: ''
      # Every eSigner signature counts against the SSL.com plan's signing quota,
      # so a dry run can opt out. Public releases (tag pushes or dry_run=false)
      # always sign when the secrets exist.
      sign_windows:
        description: 'Dry runs only: sign Windows binaries with SSL.com eSigner (public releases always sign when secrets are set)'
        type: boolean
        default: true
      staging_percentage:
        description: 'Percentage of installed apps offered the update (0-100)'
        type: string
        default: '100'

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  # Must match ci.yml. Without it the deployment floor silently tracks the runner
  # image's macOS version and ratchets with runner updates.
  MACOSX_DEPLOYMENT_TARGET: '26.2'
  MLX_METALLIB_STRICT: '1'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MLX_PREBUILT_CACHE_DIR: ${{ github.workspace }}/.mlx-prebuilt

jobs:
  windows:
    name: Package Windows ARM64
    # Install CUDA 13.4 + cuDNN 9 on GitHub-hosted windows-11-arm (matching
    # mlx-prebuilt.yml); no GPU is required. No Apple signing secrets are used.
    runs-on: windows-11-arm
    environment: desktop-release
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      windows_zip_name: ${{ steps.version.outputs.windows_zip_name }}
      windows_zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry_run && github.sha || (inputs.release_tag && format('refs/tags/{0}', inputs.release_tag)) || github.ref }}
          submodules: recursive

      - name: Record checked-out commit
        id: commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = ((git rev-parse HEAD) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') {
            throw "Failed to resolve checked-out commit SHA: $sha"
          }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: aarch64-pc-windows-msvc
          cache: false
          rustflags: ''

      - name: Setup native ARM64 MSVC environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $vs) { throw 'Visual Studio with the ARM64 C++ tools was not found' }
          $devCmd = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          $environment = cmd.exe /d /c "call `"$devCmd`" -arch=arm64 -host_arch=arm64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'Could not enter the ARM64 MSVC environment' }
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $Matches[1]
              $value = $Matches[2]
              [Environment]::SetEnvironmentVariable($name, $value, 'Process')
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      # CUDA 13.4 is the first toolkit with native Windows ARM64 packages.
      # Install only the compiler, headers and libraries used by MLX; no GPU
      # or display driver is needed because MLX_CUDA_ARCHITECTURES is pinned.
      - name: Install CUDA Toolkit 13.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'cuda-13.4.2.exe'
          Invoke-WebRequest -Uri 'https://developer.download.nvidia.com/compute/cuda/13.4.2/local_installers/cuda_13.4.2_windows_arm64.exe' -OutFile $installer
          $packages = @(
            'crt_13.4',
            'cudart_13.4',
            'nvcc_13.4',
            'nvvm_13.4',
            'nvptxcompiler_13.4',
            'nvrtc_13.4',
            'nvrtc_dev_13.4',
            'nvjitlink_13.4',
            'nvtx_13.4',
            'cublas_13.4',
            'cublas_dev_13.4',
            'cufft_13.4',
            'cufft_dev_13.4',
            'cusolver_13.4',
            'cusolver_dev_13.4',
            'cusparse_13.4',
            'cusparse_dev_13.4'
          )
          $process = Start-Process -FilePath $installer -ArgumentList (@('-s') + $packages) -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "CUDA installer exited with $($process.ExitCode)" }
          Remove-Item -LiteralPath $installer -Force
          $cuda = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.4'
          if (-not (Test-Path -LiteralPath "$cuda\bin\nvcc.exe" -PathType Leaf)) { throw 'CUDA nvcc.exe was not installed' }
          "CUDA_PATH=$cuda" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$cuda\bin", "$cuda\bin\arm64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install cuDNN 9
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'cudnn.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'cudnn-extracted'
          Invoke-WebRequest -Uri 'https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/windows-arm64/cudnn-windows-arm64-9.27.0.42_cuda13.4-archive.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          Remove-Item -LiteralPath $archive -Force
          $cudnn = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1 -ExpandProperty FullName
          if (-not $cudnn -or -not (Test-Path -LiteralPath "$cudnn\lib\arm64\cudnn.lib" -PathType Leaf)) {
            throw 'The cuDNN archive did not contain the ARM64 SDK'
          }
          "CUDNN_PATH=$cudnn" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$cudnn\bin\arm64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # MLX's CMake fetches CCCL / NVTX / cuDNN-frontend / CUTLASS from
      # GitHub. Authenticate those downloads to avoid anonymous rate limits.
      - name: Configure GitHub token for CMake downloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $netrc = @(
            'machine github.com login x-access-token password ${{ secrets.GITHUB_TOKEN }}',
            'machine objects.githubusercontent.com login x-access-token password ${{ secrets.GITHUB_TOKEN }}'
          )
          foreach ($name in '.netrc', '_netrc') {
            $netrc | Set-Content -LiteralPath (Join-Path $env:USERPROFILE $name) -Encoding ascii
          }

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v2-rust
          shared-key: windows-arm64-release

      - name: Cache prebuilt MLX
        uses: actions/cache@v6
        with:
          path: .mlx-prebuilt
          key: mlx-prebuilt-${{ runner.os }}-${{ hashFiles('crates/mlx-sys/mlx-prebuilt.json') }}

      - name: Check the Windows build environment
        id: winenv
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((node -p "process.arch") -ne 'arm64') { throw 'The release requires ARM64 Node.js.' }
          if ([string]::IsNullOrWhiteSpace($env:CUDA_PATH)) { throw 'CUDA_PATH must name the Windows ARM64 CUDA 13.4 toolkit.' }
          if ([string]::IsNullOrWhiteSpace($env:CUDNN_PATH)) { throw 'CUDNN_PATH must name the Windows ARM64 cuDNN 9 SDK.' }
          if (-not (Test-Path -LiteralPath "$env:CUDA_PATH\bin\arm64\cudart64_13.dll" -PathType Leaf)) { throw 'CUDA_PATH has no ARM64 runtime DLLs.' }
          if (-not (Test-Path -LiteralPath "$env:CUDA_PATH\include\cuda_runtime.h" -PathType Leaf)) { throw 'CUDA_PATH is missing include\cuda_runtime.h.' }
          if (-not (Test-Path -LiteralPath "$env:CUDNN_PATH\bin\arm64\cudnn64_9.dll" -PathType Leaf)) { throw 'CUDNN_PATH has no ARM64 cuDNN 9 runtime.' }
          if (-not (Test-Path -LiteralPath "$env:CUDNN_PATH\lib\arm64\cudnn.lib" -PathType Leaf)) { throw 'CUDNN_PATH is missing lib\arm64\cudnn.lib.' }
          foreach ($tool in 'makepri.exe', 'makeappx.exe', 'signtool.exe') {
            $found = $null
            if (-not [string]::IsNullOrWhiteSpace($env:WindowsSdkVerBinPath)) {
              foreach ($candidate in @(
                (Join-Path $env:WindowsSdkVerBinPath "arm64\$tool"),
                (Join-Path $env:WindowsSdkVerBinPath "x64\$tool"),
                (Join-Path $env:WindowsSdkVerBinPath $tool)
              )) {
                if (Test-Path -LiteralPath $candidate -PathType Leaf) { $found = $candidate; break }
              }
            }
            if (-not $found) {
              $kitsBin = 'C:\Program Files (x86)\Windows Kits\10\bin'
              if (Test-Path -LiteralPath $kitsBin -PathType Container) {
                foreach ($arch in 'arm64', 'x64') {
                  $candidate = Get-ChildItem -LiteralPath $kitsBin -Directory |
                    Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
                    Sort-Object { [version]$_.Name } -Descending |
                    ForEach-Object { Join-Path $_.FullName "$arch\$tool" } |
                    Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
                    Select-Object -First 1
                  if ($candidate) { $found = $candidate; break }
                }
              }
            }
            if (-not $found) {
              $cmd = Get-Command $tool -ErrorAction SilentlyContinue
              if ($cmd) { $found = $cmd.Source }
            }
            if (-not $found) { throw "Windows SDK tool not found: $tool" }
            Write-Host "Found ${tool}: $found"
            if ($tool -eq 'signtool.exe') {
              "signtool=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            }
          }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,2)}} | Format-Table -AutoSize

      - name: Install dependencies
        run: yarn install --immutable

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: yarn oxnode packages/desktop/scripts/check-release.ts resolve --tag "$env:TAG" --manifest packages/desktop/package.json

      - name: Verify release tag is publishable
        if: inputs.dry_run != true
        shell: pwsh
        env:
          TAG: ${{ env.RELEASE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ([string]::IsNullOrWhiteSpace($env:TAG)) {
            throw 'A release tag is required for publication'
          }
          $tagCommit = ((& git rev-parse --verify "refs/tags/$($env:TAG)^{commit}" 2>&1) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $($env:TAG) was not found in git checkout: $tagCommit"
          }
          $headCommit = ((& git rev-parse HEAD 2>&1) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $headCommit) {
            throw "The checkout ($headCommit) does not match release tag $($env:TAG) ($tagCommit)"
          }
          $relOut = (@(& gh api "repos/$($env:GITHUB_REPOSITORY)/releases/tags/$($env:TAG)" 2>&1 | ForEach-Object { $_.ToString() })) -join "`n"
          $relExit = $LASTEXITCODE
          if ($relExit -eq 0) {
            throw "Release $($env:TAG) is already published; refusing to rebuild or modify a public release"
          } elseif ($relOut -notmatch 'HTTP 404|"status":\s*"404"') {
            Write-Host $relOut
            throw "Failed to check release state for $($env:TAG)"
          }
          $global:LASTEXITCODE = 0
          exit 0

      # Match the macOS job: a release packages a fresh addon and its matching
      # runtime rather than reusing a stale CI artifact.
      - name: Build native + TypeScript
        run: yarn build

      - name: Build dashboard UI
        run: yarn workspace @mlx-node/dashboard build:ui

      # Packaging is split in two so the PE files are Authenticode-signed inside
      # the app directory BEFORE the ZIP/MSIX are built from it (the ZIP hash
      # feeds the release notes and the WinGet manifest, so it must be final).
      - name: Package the Windows ARM64 app
        id: app
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          yarn oxnode packages/desktop/scripts/package-windows.ts --app-version "$env:APP_VERSION" --app-only
          if ($LASTEXITCODE -ne 0) { throw 'Windows app packaging failed.' }
          $resultPath = 'packages/desktop/out/windows-app-result.json'
          if (-not (Test-Path -LiteralPath $resultPath)) { throw "Packaging produced no $resultPath" }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath $result.appPath -PathType Container)) { throw "Missing packaged app: $($result.appPath)" }
          "app=$($result.appPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # All four eSigner secrets, or the ZIP ships unsigned exactly as before.
      # Forks and repositories without the secrets keep a green release run.
      - name: Check the Windows signing secrets
        id: signing
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          # Only dry runs may opt out via sign_windows=false; public releases
          # (tag pushes or workflow_dispatch with dry_run=false) always sign when
          # secrets are set. Use format('{0}', ...) because before this PR merges
          # to main `inputs.sign_windows` can be empty and GitHub coerces '' == false.
          SIGN_REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true || format('{0}', inputs.sign_windows) != 'false' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $secretNames = @('ES_USERNAME', 'ES_PASSWORD', 'CREDENTIAL_ID', 'ES_TOTP_SECRET')
          $missing = @($secretNames |
            Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($env:SIGN_REQUESTED -ne 'true') {
            Write-Host '::notice title=Windows signing skipped::sign_windows is off for this dry run; the Windows ZIP is unsigned.'
            $enabled = 'false'
          } elseif ($missing.Count -eq $secretNames.Count) {
            Write-Host "::warning title=Windows signing skipped::None of $($secretNames -join ', ') are set. The Windows ZIP is unsigned."
            $enabled = 'false'
          } elseif ($missing.Count -gt 0) {
            throw "Partial Windows eSigner secret configuration; missing: $($missing -join ', '). Set all four secrets or remove all of them."
          } else {
            $enabled = 'true'
          }
          "enabled=$enabled" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # eSigner's batch_sign takes one flat directory (at most 100 files) and only
      # recognises some extensions: `.node` is not one of them, although a `.node`
      # addon is an ordinary PE DLL. Use `signtool verify /pa /tw /v` (no `/a`) so
      # only embedded, timestamped Authenticode signatures count — never runner-local
      # Windows catalogs (which also mask Electron's already-embedded d3dcompiler_47.dll
      # under Get-AuthenticodeSignature). Copy everything else into a flat directory
      # under neutral names, giving `.node` files a `.dll` name, and keep a map back.
      - name: Collect the Windows binaries to sign
        id: collect
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          APP: ${{ steps.app.outputs.app }}
          SIGNTOOL: ${{ steps.winenv.outputs.signtool }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if (-not (Test-Path -LiteralPath $env:SIGNTOOL -PathType Leaf)) { throw "signtool.exe not found: $env:SIGNTOOL" }
          $root = Join-Path $env:RUNNER_TEMP 'esigner'
          $inDir = Join-Path $root 'in'
          $outDir = Join-Path $root 'out'
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $inDir, $outDir | Out-Null
          $pe = @(Get-ChildItem -LiteralPath $env:APP -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll', '.node' } |
            Sort-Object FullName)
          $map = @()
          $index = 0
          foreach ($file in $pe) {
            $verifyOut = (@(& $env:SIGNTOOL verify /pa /tw /v $file.FullName 2>&1 | ForEach-Object { $_.ToString() })) -join "`n"
            $verifyExit = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            if ($verifyExit -eq 0 -and $verifyOut -match 'The signature is timestamped:') { continue }
            $status = if ($verifyOut -match 'No signature found') {
              'NotSigned'
            } elseif ($verifyExit -eq 2 -or ($verifyExit -eq 0 -and $verifyOut -notmatch 'The signature is timestamped:')) {
              'NoTimestamp'
            } else {
              "VerifyExit$verifyExit"
            }
            $index += 1
            $extension = if ($file.Extension -eq '.exe') { '.exe' } else { '.dll' }
            $name = '{0:D4}{1}' -f $index, $extension
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $inDir $name)
            $map += [pscustomobject]@{ name = $name; path = $file.FullName; status = $status }
          }
          if ($map.Count -eq 0) { throw "Found no PE files needing signing under $env:APP" }
          if ($map.Count -gt 100) { throw "eSigner batch_sign takes at most 100 files; found $($map.Count)" }
          $map | ConvertTo-Json -AsArray | Set-Content -LiteralPath (Join-Path $root 'map.json') -Encoding utf8
          $map | Format-Table name, status, path -AutoSize | Out-String -Width 400 | Write-Host
          Write-Host "Signing $($map.Count) of $($pe.Count) PE files"
          "in=$inDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "out=$outDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "map=$(Join-Path $root 'map.json')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      # CodeSignTool is a Java program. Install a native ARM64 JDK 21 (Temurin)
      # with up-to-date CA roots so we invoke CodeSignTool's JAR directly via JAVA_HOME.
      - name: Setup Java for CodeSignTool
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          architecture: aarch64

      # Credential-free pinned download (matching Komac in jobs.winget).
      - name: Install pinned CodeSignTool
        id: codesigntool
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          CODESIGNTOOL_VERSION: '1.3.2'
          CODESIGNTOOL_URL: 'https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2.zip'
          CODESIGNTOOL_SHA256: 'F14B1E1EF14BFA1FD00279C363AAB0DEBBF5DCFBA0E4BCDCE5D22BB771DE0E3A'
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "CodeSignTool-v${env:CODESIGNTOOL_VERSION}.zip"
          $dir = Join-Path $env:RUNNER_TEMP 'codesigntool'
          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri $env:CODESIGNTOOL_URL -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualSha256 -ne $env:CODESIGNTOOL_SHA256) {
            Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
            throw "CodeSignTool archive SHA-256 mismatch: expected $env:CODESIGNTOOL_SHA256, got $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $dir -Force
          Remove-Item -LiteralPath $archive -Force
          Remove-Item -LiteralPath (Join-Path $dir '__MACOSX') -Recurse -Force -ErrorAction SilentlyContinue
          $jar = Join-Path $dir "jar\code_sign_tool-${env:CODESIGNTOOL_VERSION}.jar"
          $conf = Join-Path $dir 'conf\code_sign_tool.properties'
          if (-not (Test-Path -LiteralPath $jar -PathType Leaf)) { throw "CodeSignTool JAR not found: $jar" }
          if (-not (Test-Path -LiteralPath $conf -PathType Leaf)) { throw "CodeSignTool config not found: $conf" }
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "jar=$jar" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Invoke CodeSignTool directly through java.exe (no cmd.exe wrapper).
      # $CODE_SIGN_TOOL_PATH tells CodeSignTool where conf/code_sign_tool.properties
      # lives, -Xmx4G prevents heap OOM on 200+ MB PE files like mlx-node.exe, and
      # CodeSignTool can exit 0 on error so we also fail closed if any expected
      # output file is missing or empty in $env:OUT_DIR.
      - name: Sign the Windows binaries (SSL.com eSigner)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          CODE_SIGN_TOOL_PATH: ${{ steps.codesigntool.outputs.dir }}
          CODESIGNTOOL_JAR: ${{ steps.codesigntool.outputs.jar }}
          IN_DIR: ${{ steps.collect.outputs.in }}
          OUT_DIR: ${{ steps.collect.outputs.out }}
          MAP: ${{ steps.collect.outputs.map }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandArgumentPassing = 'Standard'
          $PSNativeCommandUseErrorActionPreference = $false
          if ([string]::IsNullOrWhiteSpace($env:JAVA_HOME)) { throw 'JAVA_HOME is not set' }
          $java = Join-Path $env:JAVA_HOME 'bin\java.exe'
          if (-not (Test-Path -LiteralPath $java -PathType Leaf)) { throw "Java executable not found: $java" }
          $toolArgs = @('-Xmx4G', '-jar', $env:CODESIGNTOOL_JAR)
          $authArgs = @(
            "-username=$env:ES_USERNAME",
            "-password=$env:ES_PASSWORD",
            "-credential_id=$env:CREDENTIAL_ID"
          )
          function Invoke-CodeSignTool([string[]] $commandArgs) {
            $lines = @(& $java @toolArgs @commandArgs 2>&1 | ForEach-Object { $_.ToString() })
            $exitCode = $LASTEXITCODE
            $output = $lines -join "`n"
            if ($output.Length -gt 0) { Write-Host $output }
            return [pscustomobject]@{ ExitCode = $exitCode; Output = $output }
          }
          try {
            # Query eSigner's scan policy first. When malware blocker is enabled
            # (mandatory on many SSL.com credentials), batch_sign refuses any hash
            # not pre-scanned via scan_code (hash-only, no binary upload, no OTP).
            $scanRequired = $null
            for ($attempt = 1; $attempt -le 3; $attempt += 1) {
              $scanSettings = Invoke-CodeSignTool (@('get_scan_settings') + $authArgs)
              if ($scanSettings.ExitCode -eq 0 -and $scanSettings.Output -match 'malware scan settings enabled:\s*(true|false)') {
                $scanRequired = $Matches[1].ToLowerInvariant() -eq 'true'
                break
              }
              if ($attempt -lt 3) {
                Write-Warning "CodeSignTool get_scan_settings failed (attempt $attempt/3); retrying in 10s..."
                Start-Sleep -Seconds 10
              }
            }
            if ($null -eq $scanRequired) {
              throw 'CodeSignTool get_scan_settings failed after 3 attempts'
            }
            if ($scanRequired) {
              $files = @(Get-ChildItem -LiteralPath $env:IN_DIR -File | Sort-Object Name)
              foreach ($file in $files) {
                $scanned = $false
                for ($attempt = 1; $attempt -le 3; $attempt += 1) {
                  Write-Host "Malware scan ($attempt/3): $($file.Name)"
                  $res = Invoke-CodeSignTool (@('scan_code') + $authArgs + @("-input_file_path=$($file.FullName)"))
                  if ($res.Output -match 'code object is a malware') {
                    throw "eSigner malware scanner rejected $($file.Name)"
                  }
                  if ($res.ExitCode -eq 0 -and $res.Output -match 'code object is not a malware\. You can proceed signing this code object') {
                    $scanned = $true
                    break
                  }
                  if ($attempt -lt 3) {
                    Write-Warning "CodeSignTool scan_code for $($file.Name) did not confirm a clean scan (attempt $attempt/3); retrying in 10s..."
                    Start-Sleep -Seconds 10
                  }
                }
                if (-not $scanned) {
                  throw "CodeSignTool scan_code failed for $($file.Name) after 3 attempts"
                }
              }
            }
            $batch = Invoke-CodeSignTool (@('batch_sign') + $authArgs + @(
              "-totp_secret=$env:ES_TOTP_SECRET",
              "-input_dir_path=$env:IN_DIR",
              "-output_dir_path=$env:OUT_DIR"
            ))
            if ($batch.ExitCode -ne 0) { throw "CodeSignTool batch_sign failed with exit code $($batch.ExitCode)" }
            if ($batch.Output -match '(?m)^\s*(Error|Exception)\b') {
              throw 'CodeSignTool batch_sign reported an error (see above)'
            }
            $map = Get-Content -LiteralPath $env:MAP -Raw | ConvertFrom-Json
            $missing = @()
            foreach ($entry in $map) {
              $signedCopy = Join-Path $env:OUT_DIR $entry.name
              if (-not (Test-Path -LiteralPath $signedCopy -PathType Leaf) -or (Get-Item -LiteralPath $signedCopy).Length -eq 0) {
                $missing += "$($entry.name) ($($entry.path))"
              }
            }
            if ($missing.Count -gt 0) {
              throw "CodeSignTool left missing or empty signed outputs in $($env:OUT_DIR):`n$($missing -join "`n")"
            }
          } finally {
            if (-not [string]::IsNullOrWhiteSpace($env:CODE_SIGN_TOOL_PATH)) {
              Remove-Item -LiteralPath (Join-Path $env:CODE_SIGN_TOOL_PATH 'logs') -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      # Put every signed copy back under its real name and check with signtool
      # (/pa /tw /v, no /a) that every PE file carries a valid, embedded,
      # timestamped Authenticode signature (never relying on runner catalogs).
      - name: Install and verify the signed Windows binaries
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          OUT_DIR: ${{ steps.collect.outputs.out }}
          MAP: ${{ steps.collect.outputs.map }}
          APP: ${{ steps.app.outputs.app }}
          SIGNTOOL: ${{ steps.winenv.outputs.signtool }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if (-not (Test-Path -LiteralPath $env:SIGNTOOL -PathType Leaf)) { throw "signtool.exe not found: $env:SIGNTOOL" }
          $map = Get-Content -LiteralPath $env:MAP -Raw | ConvertFrom-Json
          foreach ($entry in $map) {
            $signedCopy = Join-Path $env:OUT_DIR $entry.name
            if (-not (Test-Path -LiteralPath $signedCopy -PathType Leaf)) { throw "eSigner returned no $($entry.name) for $($entry.path)" }
            Copy-Item -LiteralPath $signedCopy -Destination $entry.path -Force
          }
          $bad = @()
          $pe = @(Get-ChildItem -LiteralPath $env:APP -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll', '.node' })
          if ($pe.Count -eq 0) { throw "Found no PE files under $env:APP" }
          foreach ($file in $pe) {
            $verifyOut = (@(& $env:SIGNTOOL verify /pa /tw /v $file.FullName 2>&1 | ForEach-Object { $_.ToString() })) -join "`n"
            $verifyExit = $LASTEXITCODE
            if ($verifyExit -ne 0) {
              Write-Host $verifyOut
              $bad += "VerifyExit${verifyExit}: $($file.FullName)"
            } elseif ($verifyOut -notmatch 'The signature is timestamped:') {
              Write-Host $verifyOut
              $bad += "NoTimestamp: $($file.FullName)"
            }
          }
          if ($bad.Count -gt 0) { throw "Windows binaries without a valid, embedded, timestamped signature:`n$($bad -join "`n")" }
          $exePath = Join-Path $env:APP 'mlx-node.exe'
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) { throw "Missing signed executable: $exePath" }
          $exe = Get-AuthenticodeSignature -LiteralPath $exePath
          if ($null -eq $exe.SignerCertificate -or [string]::IsNullOrWhiteSpace($exe.SignerCertificate.Subject)) {
            throw 'mlx-node.exe is missing a signer certificate subject'
          }
          Write-Host "mlx-node.exe signed by: $($exe.SignerCertificate.Subject)"
          Write-Host "All $($pe.Count) PE files carry a valid, embedded, timestamped signature"

      - name: Clean up temporary Windows signing files
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            (Join-Path $env:RUNNER_TEMP 'esigner'),
            (Join-Path $env:RUNNER_TEMP 'codesigntool'),
            (Join-Path $env:RUNNER_TEMP 'CodeSignTool-v1.3.2.zip')
          )) {
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Package Windows ARM64 (ZIP + MSIX)
        id: package
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP: ${{ steps.app.outputs.app }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          $ErrorActionPreference = 'Stop'
          $argsList = @(
            'oxnode', 'packages/desktop/scripts/package-windows.ts',
            '--app-version', $env:APP_VERSION,
            '--from-app', $env:APP
          )
          if ($env:SIGNED -eq 'true') { $argsList += '--signed' }
          & yarn @argsList
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed.' }
          $resultPath = 'packages/desktop/out/windows-package-result.json'
          if (-not (Test-Path -LiteralPath $resultPath)) { throw "Packaging produced no $resultPath" }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if ($env:SIGNED -eq 'true' -and $result.signed -ne $true) {
            throw 'Expected signed Windows package result, got signed=false'
          }
          if (-not (Test-Path -LiteralPath $result.appPath -PathType Container)) { throw "Missing packaged app: $($result.appPath)" }
          if (-not (Test-Path -LiteralPath $result.zipPath -PathType Leaf)) { throw "Missing Windows ZIP: $($result.zipPath)" }
          "app=$($result.appPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip=$($result.zipPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $zipSha256 = (Get-FileHash -LiteralPath $result.zipPath -Algorithm SHA256).Hash.ToUpperInvariant()
          "zip_sha256=$zipSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (($env:APP_VERSION -notmatch '[-+]') -and [string]::IsNullOrWhiteSpace($result.msixPath)) {
            throw "Stable build $env:APP_VERSION produced no Windows MSIX"
          }
          if (-not [string]::IsNullOrWhiteSpace($result.msixPath)) {
            if (-not (Test-Path -LiteralPath $result.msixPath -PathType Leaf)) { throw "Missing Windows MSIX: $($result.msixPath)" }
            "msix=$($result.msixPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Validate the Windows app and artifact versions
        shell: pwsh
        env:
          TAG: ${{ env.RELEASE_TAG }}
          APP: ${{ steps.package.outputs.app }}
          ZIP: ${{ steps.package.outputs.zip }}
          MSIX: ${{ steps.package.outputs.msix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $argsList = @(
            'oxnode', 'packages/desktop/scripts/check-release.ts', 'verify-windows',
            '--tag', $env:TAG,
            '--manifest', 'packages/desktop/package.json',
            '--app', $env:APP,
            '--zip', $env:ZIP
          )
          if (-not [string]::IsNullOrWhiteSpace($env:MSIX)) {
            $argsList += @('--msix', $env:MSIX)
          }
          & yarn @argsList
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: mlx-node-desktop-windows-arm64
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      # Kept as a separate workflow artifact (not a GitHub Release asset) because
      # the MSIX is unsigned for Partner Center ingestion; end users cannot
      # sideload an unsigned MSIX directly.
      - name: Upload the Windows ARM64 MSIX artifact
        if: steps.package.outputs.msix != ''
        uses: actions/upload-artifact@v7
        with:
          name: mlx-node-desktop-windows-arm64-msix
          path: ${{ steps.package.outputs.msix }}
          if-no-files-found: error

      - name: Generate WinGet manifests
        if: "!contains(steps.version.outputs.version, '-') && !contains(steps.version.outputs.version, '+')"
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ env.RELEASE_TAG }}
          ZIP: ${{ steps.package.outputs.zip }}
          WINGET_PACKAGE_ID: ${{ vars.WINGET_PACKAGE_ID }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $argsList = @(
            'oxnode', 'packages/desktop/scripts/winget-manifest.ts',
            '--version', $env:APP_VERSION,
            '--zip', $env:ZIP,
            '--out', 'packages/desktop/out/winget',
            '--repo', $env:REPO
          )
          if (-not [string]::IsNullOrWhiteSpace($env:TAG)) {
            $argsList += @('--tag', $env:TAG)
          }
          & yarn @argsList
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the WinGet manifests artifact
        if: "!contains(steps.version.outputs.version, '-') && !contains(steps.version.outputs.version, '+')"
        uses: actions/upload-artifact@v7
        with:
          name: mlx-node-desktop-winget-manifests
          path: packages/desktop/out/winget
          if-no-files-found: error

  macos:
    name: Package and sign macOS ARM64
    runs-on: macos-26
    environment: desktop-release
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      dmg_name: ${{ steps.version.outputs.dmg_name }}
      zip_name: ${{ steps.version.outputs.zip_name }}
      windows_zip_name: ${{ steps.version.outputs.windows_zip_name }}
      dmg_sha256: ${{ steps.hashes.outputs.dmg_sha256 }}
      zip_sha256: ${{ steps.hashes.outputs.zip_sha256 }}
      blockmap_sha256: ${{ steps.hashes.outputs.blockmap_sha256 }}
      manifest_sha256: ${{ steps.hashes.outputs.manifest_sha256 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry_run && github.sha || (inputs.release_tag && format('refs/tags/{0}', inputs.release_tag)) || github.ref }}
          submodules: recursive

      - name: Record checked-out commit
        id: commit
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Failed to resolve checked-out commit SHA: $SHA"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: aarch64-apple-darwin
          cache: false
          rustflags: ''

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v2-rust
          shared-key: desktop-release

      - name: Cache prebuilt MLX
        uses: actions/cache@v6
        with:
          path: .mlx-prebuilt
          key: mlx-prebuilt-${{ runner.os }}-${{ hashFiles('crates/mlx-sys/mlx-prebuilt.json') }}

      - name: Configure GitHub token for CMake downloads
        run: |
          echo "machine github.com login x-access-token password ${{ secrets.GITHUB_TOKEN }}" >> ~/.netrc
          echo "machine objects.githubusercontent.com login x-access-token password ${{ secrets.GITHUB_TOKEN }}" >> ~/.netrc
          chmod 600 ~/.netrc

      - name: Install dependencies
        run: yarn install --immutable

      # BEFORE the ~16 minute build, because the thing it catches is a stale
      # manifest and the remedy is a one-line edit. `tools bump` bumps
      # `manifest.private !== true` workspaces only, and @mlx-node/desktop is
      # private (it must never reach npm) — so its version does NOT advance with
      # the repo's. Left unchecked, a v0.0.9 release packages a 0.0.8 app, names
      # the DMG 0.0.8 and bumps the cask to 0.0.8: consistently wrong, because all
      # three read that same stale manifest.
      #
      # RELEASE_TAG comes from the pushed tag or the dispatch input. With neither,
      # only a dry run is allowed to use the manifest as its source. Tag values
      # are passed through env rather than interpolated into shell code.
      - name: Resolve release version
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          yarn oxnode packages/desktop/scripts/check-release.ts resolve --tag "$TAG" --manifest packages/desktop/package.json
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify release tag is publishable
        if: inputs.dry_run != true
        env:
          TAG: ${{ env.RELEASE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::A release tag is required for publication"
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::The checkout ($HEAD_COMMIT) does not match release tag $TAG ($TAG_COMMIT)"
            exit 1
          fi
          set +e
          rel_out="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1)"
          rel_exit=$?
          set -e
          if [ "$rel_exit" -eq 0 ]; then
            echo "::error::Release $TAG is already published; refusing to rebuild or modify a public release"
            exit 1
          elif ! grep -Eq 'HTTP 404|"status":[[:space:]]*"404"' <<< "$rel_out"; then
            printf '%s\n' "$rel_out"
            echo "::error::Failed to check release state for $TAG"
            exit 1
          fi

      # Deliberately a fresh build, not a `gh run download` of ci.yml's artifacts.
      # A release is rare and the ~16 min is worth it: artifact reuse is exactly how
      # a stale metallib gets paired with a current .node, and that failure mode is
      # garbage inference output with no load-time error.
      - name: Build native + TypeScript
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn build

      - name: Build dashboard UI
        run: yarn workspace @mlx-node/dashboard build:ui

      # The packaged app must ship the prebuilt grok-build fork binary — `mlx
      # agent` probes Contents/Resources/native/mlx-agent before it ever tries
      # a runtime download. package.ts refuses to --sign without it. Fetching
      # BEFORE the signing/packaging sequence means a download failure costs
      # seconds instead of a signed-then-incomplete bundle.
      - name: Fetch prebuilt mlx-agent
        run: yarn oxnode packages/desktop/scripts/fetch-agent.ts

      # A dedicated keychain, not the login keychain: the runner is ephemeral but
      # the login keychain is shared with every other step, and `security unlock`
      # on it would expose anything else stored there.
      - name: Import signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          # Random, never printed. It only has to outlive this job.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          echo -n "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Default timeout locks the keychain mid-job on a slow build.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this codesign blocks on a GUI keychain-access prompt that can
          # never be answered, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in the keychain"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Found identity: ${IDENTITY%% (*} (…)"

      # Packages, rewrites the addon's LC_ID_DYLIB + code-signing identifier, then
      # signs inside-out with its own `codesign` calls — NOT with
      # @electron/osx-sign, which decides what to sign by content-sniffing and
      # chokes on this bundle's payload (see the comment in package.ts). The
      # install-name rewrite is not cosmetic: the addon ships
      # `/Users/<builder>/.../target/.../libmlx_core.dylib` otherwise, leaking a
      # home directory to every user.
      #
      # `package.ts` writes out/package-result.json with the bundle path it
      # actually produced. Nothing here reconstructs that path: packager returns
      # the PLATFORM directory (out/mlx-node-darwin-arm64) and puts the bundle
      # inside it, so every hand-written `out/mlx-node.app` was one level too high
      # and this workflow could not get past its first gate.
      - name: Package and sign
        id: package
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          yarn oxnode packages/desktop/scripts/package.ts --sign --app-version "$APP_VERSION"
          RESULT=packages/desktop/out/package-result.json
          [ -f "$RESULT" ] || { echo "::error::packaging produced no $RESULT"; exit 1; }
          APP="$(node -p "require('./$RESULT').appPath")"
          # Asserted here so a layout change fails at its source rather than as an
          # ENOENT three steps later on a path that looks perfectly plausible.
          [ -d "$APP" ] || { echo "::error::package-result.json points at $APP, which does not exist"; exit 1; }
          [ -f "$APP/Contents/Info.plist" ] || { echo "::error::$APP is not a bundle"; exit 1; }
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      # The gate that matters. `codesign --verify --deep --strict` passes on a
      # bundle containing an unsigned Mach-O and the notary rejects it hours later,
      # so this runs BEFORE submission — a notarization round trip is the most
      # expensive way possible to discover a missed binary.
      - name: Verify bundle (pre-notarization)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: yarn oxnode packages/desktop/scripts/verify-bundle.ts "${{ steps.package.outputs.app }}"

      # Written once and reused by both notarization steps. `notarytool` wants a
      # FILE, so the secret has to land on disk somewhere; RUNNER_TEMP is wiped
      # with the runner, and 600 keeps it off any other user on a self-hosted box.
      # base64 because a .p8 is multi-line PEM, and a secret that round-trips
      # through YAML is one indentation rule away from arriving corrupted.
      - name: Materialize the App Store Connect API key
        if: inputs.dry_run != true
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          # Fail here rather than inside notarytool, where a malformed key reports
          # as an authentication error and sends you looking at the wrong secret.
          head -1 "$KEY" | grep -q 'BEGIN PRIVATE KEY' \
            || { echo "::error::APPLE_API_KEY_P8 did not decode to a PEM private key"; exit 1; }
          echo "ASC_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Notarize and staple
        if: inputs.dry_run != true
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP: ${{ steps.package.outputs.app }}
        run: |
          set -euo pipefail
          # notarytool takes an archive, never a .app directory. ditto preserves the
          # extended attributes and symlinks that a plain `zip` drops — and a dropped
          # symlink inside a .framework invalidates the signature.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/upload.zip"
          xcrun notarytool submit "$RUNNER_TEMP/upload.zip" \
            --key "$ASC_API_KEY" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 45m
          # Staple the .app itself so first launch works with no network. Documented
          # service limit is 75 submissions/day; most return in under 5 minutes.
          xcrun stapler staple "$APP"

      - name: Verify bundle (post-notarization)
        if: inputs.dry_run != true
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: yarn oxnode packages/desktop/scripts/verify-bundle.ts "${{ steps.package.outputs.app }}" --notarized

      # Squirrel.Mac consumes a ZIP, not a DMG. Archive the stapled app so the
      # updater gets the same signed payload as a fresh installation. The name
      # includes the version and architecture for differential-update lookup.
      - name: Build update ZIP
        id: zip
        env:
          APP: ${{ steps.package.outputs.app }}
          ZIP_NAME: ${{ steps.version.outputs.zip_name }}
        run: |
          set -euo pipefail
          ZIP="packages/desktop/out/$ZIP_NAME"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Verify archived update
        env:
          TAG: ${{ env.RELEASE_TAG }}
          ZIP: ${{ steps.zip.outputs.path }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          EXTRACTED="$RUNNER_TEMP/update-verification"
          ditto -x -k "$ZIP" "$EXTRACTED"
          APP="$EXTRACTED/mlx-node.app"
          codesign --verify --deep --strict "$APP"
          yarn oxnode packages/desktop/scripts/check-release.ts verify \
            --tag "$TAG" --manifest packages/desktop/package.json --app "$APP" --zip "$ZIP"
          if [ "$DRY_RUN" != "true" ]; then
            xcrun stapler validate "$APP"
          fi

      - name: Generate update manifest and blockmap
        id: update
        env:
          APP: ${{ steps.package.outputs.app }}
          ZIP: ${{ steps.zip.outputs.path }}
          STAGING_PERCENTAGE: ${{ inputs.staging_percentage || vars.DESKTOP_UPDATE_STAGING_PERCENTAGE || '100' }}
        run: |
          yarn oxnode packages/desktop/scripts/generate-update.ts --app "$APP" --zip "$ZIP" \
            --staging-percentage "$STAGING_PERCENTAGE"

      # The filename is spelled once, by `scripts/release-version.ts`, and parsed
      # back out of it by the next step — so a DMG whose name disagrees with what
      # is inside it cannot reach a release.
      - name: Build DMG
        id: dmg
        env:
          APP: ${{ steps.package.outputs.app }}
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
        run: |
          set -euo pipefail
          DMG="packages/desktop/out/$DMG_NAME"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          # Copy the STAPLED .app; a ticket stapled after imaging would not be inside.
          ditto "$APP" "$STAGE/mlx-node.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "mlx-node" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      # Re-derives nothing. It reads CFBundleShortVersionString and CFBundleVersion
      # out of the plist that was actually written and the version out of the DMG's
      # actual filename, and fails unless they and the tag and the manifest are one
      # version. `resolve` above only proved the INPUTS agreed; this proves the
      # artifacts do. Runs before the DMG is notarized — the expensive step.
      - name: Validate macOS artifact versions
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          yarn oxnode packages/desktop/scripts/check-release.ts verify \
            --tag "$TAG" --manifest packages/desktop/package.json \
            --app "${{ steps.package.outputs.app }}" --dmg "${{ steps.dmg.outputs.path }}" \
            --zip "${{ steps.zip.outputs.path }}"

      # The DMG is a separate distributable and Gatekeeper assesses it on its own,
      # so it needs its own signature, notarization and ticket. Skipping this is the
      # classic "the .app is notarized but the download is still quarantined" bug.
      - name: Sign, notarize and staple the DMG
        if: inputs.dry_run != true
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail
          codesign --sign "$SIGN_IDENTITY" --timestamp --options runtime "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$ASC_API_KEY" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 45m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      # Hash the final (signed/notarized on real releases) macOS artifacts right
      # before upload so `publish` can verify every downloaded file bit-for-bit.
      - name: Compute macOS artifact SHA-256 digests
        id: hashes
        env:
          DMG: ${{ steps.dmg.outputs.path }}
          ZIP: ${{ steps.zip.outputs.path }}
          BLOCKMAP: ${{ steps.update.outputs.blockmap }}
          MANIFEST: ${{ steps.update.outputs.manifest }}
        run: |
          set -euo pipefail
          hash_artifact() {
            local key="$1"
            local path="$2"
            if [ ! -f "$path" ] || [ ! -s "$path" ]; then
              echo "::error::Missing or empty macOS artifact for $key: $path"
              exit 1
            fi
            local digest
            digest="$(shasum -a 256 "$path" | cut -d' ' -f1 | tr '[:upper:]' '[:lower:]')"
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid SHA-256 digest for $path: $digest"
              exit 1
            fi
            echo "${key}=${digest}" >> "$GITHUB_OUTPUT"
          }
          hash_artifact dmg_sha256 "$DMG"
          hash_artifact zip_sha256 "$ZIP"
          hash_artifact blockmap_sha256 "$BLOCKMAP"
          hash_artifact manifest_sha256 "$MANIFEST"

      - uses: actions/upload-artifact@v7
        with:
          name: mlx-node-desktop-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: mlx-node-desktop-update
          path: |
            ${{ steps.zip.outputs.path }}
            ${{ steps.update.outputs.blockmap }}
            ${{ steps.update.outputs.manifest }}
          if-no-files-found: error

      # `always()` so a failure anywhere above still removes the private key from
      # the runner. The runner is ephemeral, but a leaked key outliving the job on a
      # reused runner is not a risk worth carrying for one line.
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true

  publish:
    name: Publish desktop release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    environment: desktop-release
    outputs:
      version: ${{ steps.verify.outputs.version }}
      release_tag: ${{ steps.verify.outputs.release_tag }}
      windows_zip_name: ${{ steps.verify.outputs.windows_zip_name }}
      published: ${{ steps.publish.outputs.published }}
    permissions:
      contents: write
      actions: read
    steps:
      # Require both builders to agree on one commit SHA BEFORE checking out or
      # running any repository code (including Yarn).
      - name: Verify build jobs produced the same commit
        id: target
        env:
          WINDOWS_COMMIT: ${{ needs.windows.outputs.commit }}
          MACOS_COMMIT: ${{ needs.macos.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ ! "$WINDOWS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$MACOS_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid build commit SHA: windows=$WINDOWS_COMMIT macos=$MACOS_COMMIT"
            exit 1
          fi
          if [ "$WINDOWS_COMMIT" != "$MACOS_COMMIT" ]; then
            echo "::error::Build jobs checked out different commits: windows=$WINDOWS_COMMIT macos=$MACOS_COMMIT"
            exit 1
          fi
          echo "sha=$WINDOWS_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Verify checked-out commit and release tag
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Publish checkout ($HEAD_SHA) does not match verified build commit ($EXPECTED_SHA)"
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ]; then
            if [ -z "$TAG" ]; then
              echo "::error::A release tag is required for publication"
              exit 1
            fi
            git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
            TAG_SHA="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
            if [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
              echo "::error::Release tag $TAG ($TAG_SHA) no longer matches verified build commit ($EXPECTED_SHA)"
              exit 1
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download the macOS DMG artifact
        uses: actions/download-artifact@v8
        with:
          name: mlx-node-desktop-dmg
          path: packages/desktop/out/release-artifacts/dmg

      - name: Download the macOS update artifacts
        uses: actions/download-artifact@v8
        with:
          name: mlx-node-desktop-update
          path: packages/desktop/out/release-artifacts/update

      - name: Download the Windows ARM64 artifact
        uses: actions/download-artifact@v8
        with:
          name: mlx-node-desktop-windows-arm64
          path: packages/desktop/out/release-artifacts/windows

      - name: Verify cross-platform commits, versions, and artifact digests
        id: verify
        env:
          TAG: ${{ env.RELEASE_TAG }}
          WINDOWS_COMMIT: ${{ needs.windows.outputs.commit }}
          WINDOWS_VERSION: ${{ needs.windows.outputs.version }}
          WINDOWS_ZIP_NAME_IN: ${{ needs.windows.outputs.windows_zip_name }}
          WINDOWS_ZIP_SHA256: ${{ needs.windows.outputs.windows_zip_sha256 }}
          MACOS_COMMIT: ${{ needs.macos.outputs.commit }}
          MACOS_VERSION: ${{ needs.macos.outputs.version }}
          MACOS_RELEASE_TAG: ${{ needs.macos.outputs.release_tag }}
          MACOS_DMG_NAME: ${{ needs.macos.outputs.dmg_name }}
          MACOS_ZIP_NAME: ${{ needs.macos.outputs.zip_name }}
          MACOS_WINDOWS_ZIP_NAME: ${{ needs.macos.outputs.windows_zip_name }}
          MACOS_DMG_SHA256: ${{ needs.macos.outputs.dmg_sha256 }}
          MACOS_ZIP_SHA256: ${{ needs.macos.outputs.zip_sha256 }}
          MACOS_BLOCKMAP_SHA256: ${{ needs.macos.outputs.blockmap_sha256 }}
          MACOS_MANIFEST_SHA256: ${{ needs.macos.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Failed to resolve publish checkout commit SHA: $HEAD_SHA"
            exit 1
          fi
          if [ "$WINDOWS_COMMIT" != "$HEAD_SHA" ] || [ "$MACOS_COMMIT" != "$HEAD_SHA" ]; then
            echo "::error::Cross-platform commit mismatch: publish=$HEAD_SHA windows=$WINDOWS_COMMIT macos=$MACOS_COMMIT"
            exit 1
          fi

          RESOLVED="$(mktemp "$RUNNER_TEMP/resolved-version.XXXXXX")"
          trap 'rm -f "$RESOLVED"' EXIT
          GITHUB_OUTPUT="$RESOLVED" yarn oxnode packages/desktop/scripts/check-release.ts resolve \
            --tag "$TAG" --manifest packages/desktop/package.json
          version=""
          dmg_name=""
          zip_name=""
          windows_zip_name=""
          while IFS='=' read -r key val; do
            case "$key" in
              version) version="$val" ;;
              dmg_name) dmg_name="$val" ;;
              zip_name) zip_name="$val" ;;
              windows_zip_name) windows_zip_name="$val" ;;
            esac
          done < "$RESOLVED"
          if [ -z "$version" ] || [ -z "$dmg_name" ] || [ -z "$zip_name" ] || [ -z "$windows_zip_name" ]; then
            echo "::error::check-release.ts resolve did not emit all expected outputs"
            exit 1
          fi

          if [ "$WINDOWS_VERSION" != "$version" ] || [ "$MACOS_VERSION" != "$version" ]; then
            echo "::error::Cross-platform version mismatch: resolved=$version windows=$WINDOWS_VERSION macos=$MACOS_VERSION"
            exit 1
          fi
          if [ "$WINDOWS_ZIP_NAME_IN" != "$windows_zip_name" ] || [ "$MACOS_WINDOWS_ZIP_NAME" != "$windows_zip_name" ]; then
            echo "::error::Windows ZIP name mismatch: resolved=$windows_zip_name windows=$WINDOWS_ZIP_NAME_IN macos=$MACOS_WINDOWS_ZIP_NAME"
            exit 1
          fi
          if [ "$MACOS_DMG_NAME" != "$dmg_name" ] || [ "$MACOS_ZIP_NAME" != "$zip_name" ]; then
            echo "::error::macOS artifact name mismatch: expected dmg=$dmg_name zip=$zip_name, got dmg=$MACOS_DMG_NAME zip=$MACOS_ZIP_NAME"
            exit 1
          fi
          if [ "$MACOS_RELEASE_TAG" != "$TAG" ]; then
            echo "::error::Release tag mismatch: publish=$TAG macos=$MACOS_RELEASE_TAG"
            exit 1
          fi

          DMG="packages/desktop/out/release-artifacts/dmg/$dmg_name"
          ZIP="packages/desktop/out/release-artifacts/update/$zip_name"
          BLOCKMAP="packages/desktop/out/release-artifacts/update/${zip_name}.blockmap"
          MANIFEST="packages/desktop/out/release-artifacts/update/latest-mac.yml"
          WINDOWS_ZIP="packages/desktop/out/release-artifacts/windows/$windows_zip_name"

          verify_artifact() {
            local label="$1"
            local path="$2"
            local expected="$3"
            if [[ ! "$expected" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "::error::Expected SHA-256 for $label is not a valid 64-character hex digest: $expected"
              exit 1
            fi
            if [ ! -f "$path" ] || [ ! -s "$path" ]; then
              echo "::error::Missing or empty $label artifact: $path"
              exit 1
            fi
            local expected_lower actual_lower
            expected_lower="${expected,,}"
            actual_lower="$(sha256sum "$path" | cut -d' ' -f1 | tr '[:upper:]' '[:lower:]')"
            if [ "$actual_lower" != "$expected_lower" ]; then
              echo "::error::SHA-256 mismatch for $label ($path): expected $expected_lower, got $actual_lower"
              exit 1
            fi
            echo "Verified $label: $path ($actual_lower)"
          }

          verify_artifact "macOS DMG" "$DMG" "$MACOS_DMG_SHA256"
          verify_artifact "macOS update ZIP" "$ZIP" "$MACOS_ZIP_SHA256"
          verify_artifact "macOS blockmap" "$BLOCKMAP" "$MACOS_BLOCKMAP_SHA256"
          verify_artifact "macOS update manifest" "$MANIFEST" "$MACOS_MANIFEST_SHA256"
          verify_artifact "Windows ZIP" "$WINDOWS_ZIP" "$WINDOWS_ZIP_SHA256"

          {
            echo "version=$version"
            echo "release_tag=$TAG"
            echo "windows_zip_name=$windows_zip_name"
            echo "dmg=$DMG"
            echo "zip=$ZIP"
            echo "blockmap=$BLOCKMAP"
            echo "manifest=$MANIFEST"
            echo "windows_zip=$WINDOWS_ZIP"
            echo "dmg_sha256=${MACOS_DMG_SHA256,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare draft release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn oxnode packages/desktop/scripts/publish-release.ts prepare --tag "$RELEASE_TAG"

      - name: Upload artifacts and publish the draft release
        id: publish
        if: inputs.dry_run != true
        # Includes up to three hours for CI on the exact tagged commit. A failed
        # or missing CI run leaves the fully uploaded release in draft.
        timeout-minutes: 190
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DMG: ${{ steps.verify.outputs.dmg }}
          ZIP: ${{ steps.verify.outputs.zip }}
          BLOCKMAP: ${{ steps.verify.outputs.blockmap }}
          MANIFEST: ${{ steps.verify.outputs.manifest }}
          WINDOWS_ZIP: ${{ steps.verify.outputs.windows_zip }}
        run: |
          set -euo pipefail
          yarn oxnode packages/desktop/scripts/publish-release.ts publish --tag "$RELEASE_TAG" \
            --dmg "$DMG" --zip "$ZIP" --blockmap "$BLOCKMAP" --manifest "$MANIFEST" \
            --windows-zip "$WINDOWS_ZIP"
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Scoped only to this step (not job-level env) so earlier steps never see
      # HOMEBREW_TAP_TOKEN; empty-token opt-out is checked inside the step body.
      - name: Bump the Homebrew cask
        if: inputs.dry_run != true && !contains(steps.verify.outputs.version, '-') && !contains(steps.verify.outputs.version, '+')
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # From the tag, via the same validated value the DMG was named with —
          # NOT re-read from the private manifest, which does not advance.
          VERSION: ${{ steps.verify.outputs.version }}
          DMG: ${{ steps.verify.outputs.dmg }}
          EXPECTED_DMG_SHA256: ${{ steps.verify.outputs.dmg_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew cask bump."
            exit 0
          fi
          SHA256="$(sha256sum "$DMG" | cut -d' ' -f1)"
          if [ "$SHA256" != "$EXPECTED_DMG_SHA256" ]; then
            echo "::error::DMG SHA-256 mismatch before Homebrew cask bump: expected $EXPECTED_DMG_SHA256, got $SHA256"
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY_OWNER/homebrew-tap.git" "$RUNNER_TEMP/tap"
          CASK="$RUNNER_TEMP/tap/Casks/mlx-node.rb"
          # Anchored to the field names so a version string appearing elsewhere in
          # the cask (a caveat, a zap path) is not rewritten too.
          sed -i -e "s|^  version \".*\"|  version \"$VERSION\"|" \
                 -e "s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" "$CASK"
          grep -Fxq "  version \"$VERSION\"" "$CASK" \
            || { echo "::error::Failed to update version line in $CASK"; exit 1; }
          grep -Fxq "  sha256 \"$SHA256\"" "$CASK" \
            || { echo "::error::Failed to update sha256 line in $CASK"; exit 1; }
          git -C "$RUNNER_TEMP/tap" add Casks/mlx-node.rb
          git -C "$RUNNER_TEMP/tap" -c user.name=github-actions \
            -c user.email=github-actions@github.com commit -m "mlx-node $VERSION"
          git -C "$RUNNER_TEMP/tap" push

  winget:
    name: Submit WinGet update
    needs: [windows, publish]
    runs-on: ubuntu-latest
    environment: desktop-release
    if: always() && needs.publish.outputs.published == 'true' && inputs.dry_run != true && !contains(needs.publish.outputs.version, '-') && !contains(needs.publish.outputs.version, '+')
    permissions:
      contents: read
    steps:
      - name: Install pinned Komac
        env:
          KOMAC_VERSION: '2.17.2'
          KOMAC_URL: 'https://github.com/russellbanks/Komac/releases/download/v2.17.2/komac-2.17.2-x86_64-unknown-linux-gnu.tar.gz'
          KOMAC_SHA256: 'b03b020eec98acfb0b53e284a6e21815b884be33de6785b97e7a120f0e748966'
        run: |
          set -euo pipefail
          TARBALL="$RUNNER_TEMP/komac-${KOMAC_VERSION}.tar.gz"
          curl -fsSL -o "$TARBALL" "$KOMAC_URL"
          echo "$KOMAC_SHA256  $TARBALL" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/komac"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/komac" komac
          chmod +x "$RUNNER_TEMP/komac/komac"
          rm -f "$TARBALL"

      # Confirm the live GitHub Release asset URL and SHA-256 match the built
      # Windows ZIP before invoking Komac with WINGET_TOKEN.
      - name: Verify published Windows ZIP asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
          WINDOWS_ZIP_NAME: ${{ needs.publish.outputs.windows_zip_name }}
          EXPECTED_SHA256: ${{ needs.windows.outputs.windows_zip_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ] || [ -z "$RELEASE_TAG" ] || [ -z "$WINDOWS_ZIP_NAME" ] || [ -z "$EXPECTED_SHA256" ]; then
            echo "::error::Missing release outputs required to verify published Windows ZIP asset (version, release_tag, windows_zip_name, or windows_zip_sha256)."
            exit 1
          fi
          EXPECTED_SHA256="${EXPECTED_SHA256^^}"
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::Expected Windows ZIP SHA-256 is not a valid 64-character hex digest: $EXPECTED_SHA256"
            exit 1
          fi
          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [ "$(jq -r '.draft' <<< "$RELEASE_JSON")" != "false" ]; then
            echo "::error::Release $RELEASE_TAG is still a draft; refusing to submit WinGet update."
            exit 1
          fi
          ASSET_JSON="$(jq -c --arg name "$WINDOWS_ZIP_NAME" '[.assets[] | select(.name == $name)]' <<< "$RELEASE_JSON")"
          ASSET_COUNT="$(jq 'length' <<< "$ASSET_JSON")"
          if [ "$ASSET_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 published release asset named $WINDOWS_ZIP_NAME on tag $RELEASE_TAG (found $ASSET_COUNT)."
            exit 1
          fi
          ASSET_STATE="$(jq -r '.[0].state // empty' <<< "$ASSET_JSON")"
          if [ "$ASSET_STATE" != "uploaded" ]; then
            echo "::error::Published release asset $WINDOWS_ZIP_NAME is not uploaded (state=$ASSET_STATE)."
            exit 1
          fi
          EXPECTED_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$WINDOWS_ZIP_NAME"
          DOWNLOAD_URL="$(jq -r '.[0].browser_download_url // empty' <<< "$ASSET_JSON")"
          if [ "$DOWNLOAD_URL" != "$EXPECTED_URL" ]; then
            echo "::error::Published asset browser_download_url ($DOWNLOAD_URL) does not match expected URL ($EXPECTED_URL)."
            exit 1
          fi
          ASSET_DIGEST="$(jq -r '.[0].digest // empty' <<< "$ASSET_JSON")"
          if [[ "$ASSET_DIGEST" == sha256:* ]]; then
            ACTUAL_SHA256="${ASSET_DIGEST#sha256:}"
            ACTUAL_SHA256="${ACTUAL_SHA256^^}"
            if [[ ! "$ACTUAL_SHA256" =~ ^[0-9A-F]{64}$ ]]; then
              echo "::error::Published asset digest has invalid sha256 format: $ASSET_DIGEST"
              exit 1
            fi
            if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "::error::Published asset digest ($ACTUAL_SHA256) does not match expected Windows ZIP SHA-256 ($EXPECTED_SHA256)."
              exit 1
            fi
            echo "Verified published Windows ZIP asset via GitHub Release digest: $DOWNLOAD_URL ($ACTUAL_SHA256)"
          else
            ACTUAL_SHA256="$(curl -fsSL "$DOWNLOAD_URL" | sha256sum | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"
            if [[ ! "$ACTUAL_SHA256" =~ ^[0-9A-F]{64}$ ]] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "::error::Downloaded Windows ZIP SHA-256 ($ACTUAL_SHA256) does not match expected SHA-256 ($EXPECTED_SHA256)."
              exit 1
            fi
            echo "Verified published Windows ZIP asset via stream SHA-256: $DOWNLOAD_URL ($ACTUAL_SHA256)"
          fi

      - name: Publish to winget-pkgs
        id: submit
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          PACKAGE_ID: ${{ vars.WINGET_PACKAGE_ID || 'mlx-node.mlx-node' }}
          VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
          WINDOWS_ZIP_NAME: ${{ needs.publish.outputs.windows_zip_name }}
        run: |
          set -euo pipefail
          if [ -z "$WINGET_TOKEN" ]; then
            echo "WINGET_TOKEN is not set; skipping WinGet submission."
            exit 0
          fi
          if [ -z "$VERSION" ] || [ -z "$RELEASE_TAG" ] || [ -z "$WINDOWS_ZIP_NAME" ]; then
            echo "::error::Missing release outputs required for WinGet submission (version, release_tag, or windows_zip_name)."
            exit 1
          fi
          INSTALLER_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$WINDOWS_ZIP_NAME"
          KOMAC_LOG="$RUNNER_TEMP/komac-submit.log"
          GITHUB_TOKEN="$WINGET_TOKEN" "$RUNNER_TEMP/komac/komac" update "$PACKAGE_ID" \
            --version "$VERSION" \
            --urls "$INSTALLER_URL" \
            --submit | tee "$KOMAC_LOG"
          # Strip ANSI escape codes before scanning for the created winget-pkgs PR URL.
          PR_NUMBER="$(sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "$KOMAC_LOG" \
            | grep -Eo 'https://github\.com/microsoft/winget-pkgs/pull/[0-9]+' \
            | tail -n 1 \
            | grep -Eo '[0-9]+$' || true)"
          echo "submitted=true" >> "$GITHUB_OUTPUT"
          if [ -n "$PR_NUMBER" ]; then
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      # Komac exits 0 in CI when get_existing_pull_request matches a closed or
      # stale PR, so confirm the exact installer manifest (with the published
      # arm64 ZIP URL and SHA-256) exists on winget-pkgs default branch or on
      # an open PR targeting the default branch that adds/modifies it.
      - name: Verify WinGet submission
        if: steps.submit.outputs.submitted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ID: ${{ vars.WINGET_PACKAGE_ID || 'mlx-node.mlx-node' }}
          VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
          WINDOWS_ZIP_NAME: ${{ needs.publish.outputs.windows_zip_name }}
          EXPECTED_SHA256: ${{ needs.windows.outputs.windows_zip_sha256 }}
          PR_NUMBER: ${{ steps.submit.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_SHA256" ]; then
            echo "::error::Missing windows_zip_sha256 output for WinGet verification."
            exit 1
          fi
          INSTALLER_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$WINDOWS_ZIP_NAME"
          FIRST_LETTER="$(printf '%s' "${PACKAGE_ID:0:1}" | tr '[:upper:]' '[:lower:]')"
          MANIFEST_PATH="manifests/$FIRST_LETTER/${PACKAGE_ID//./\/}/$VERSION"
          INSTALLER_MANIFEST="$MANIFEST_PATH/$PACKAGE_ID.installer.yaml"
          DEFAULT_BRANCH="$(gh api repos/microsoft/winget-pkgs --jq '.default_branch')"
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::error::Failed to resolve default branch for microsoft/winget-pkgs."
            exit 1
          fi

          verify_installer_manifest() {
            local repo="$1"
            local ref="$2"
            local encoded
            if [ -n "$ref" ]; then
              encoded="$(gh api "repos/$repo/contents/$INSTALLER_MANIFEST?ref=$ref" --jq '.content' 2>/dev/null)" || return 1
            else
              encoded="$(gh api "repos/$repo/contents/$INSTALLER_MANIFEST" --jq '.content' 2>/dev/null)" || return 1
            fi
            [ -n "$encoded" ] || return 1
            printf '%s' "$encoded" | tr -d '\n' | base64 -d | EXPECTED_ID="$PACKAGE_ID" EXPECTED_VER="$VERSION" EXPECTED_URL="$INSTALLER_URL" EXPECTED_SHA="$EXPECTED_SHA256" python3 -c '
          import os, sys, yaml
          doc = yaml.safe_load(sys.stdin.read())
          if not isinstance(doc, dict):
              sys.exit(1)
          if str(doc.get("PackageIdentifier", "")) != os.environ["EXPECTED_ID"]:
              sys.exit(1)
          if str(doc.get("PackageVersion", "")) != os.environ["EXPECTED_VER"]:
              sys.exit(1)
          expected_url = os.environ["EXPECTED_URL"]
          expected_sha = os.environ["EXPECTED_SHA"].upper()
          installers = doc.get("Installers")
          if not isinstance(installers, list):
              sys.exit(1)
          for item in installers:
              if not isinstance(item, dict):
                  continue
              arch = str(item.get("Architecture", "")).lower()
              url = str(item.get("InstallerUrl", ""))
              sha = str(item.get("InstallerSha256", "")).upper()
              if arch == "arm64" and url == expected_url and sha == expected_sha:
                  sys.exit(0)
          sys.exit(1)
          '
          }

          verify_open_pr() {
            local pr_num="$1"
            local pr_json state base_ref head_repo head_sha pr_url changed_files
            pr_json="$(gh api "repos/microsoft/winget-pkgs/pulls/$pr_num" 2>/dev/null)" || return 1
            state="$(jq -r '.state' <<< "$pr_json")"
            base_ref="$(jq -r '.base.ref // empty' <<< "$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // empty' <<< "$pr_json")"
            head_sha="$(jq -r '.head.sha // empty' <<< "$pr_json")"
            pr_url="$(jq -r '.html_url' <<< "$pr_json")"
            if [ "$state" != "open" ]; then
              return 1
            fi
            if [ "$base_ref" != "$DEFAULT_BRANCH" ]; then
              echo "::warning::Candidate open WinGet PR $pr_url targets $base_ref instead of $DEFAULT_BRANCH."
              return 1
            fi
            if [ -z "$head_repo" ] || [ -z "$head_sha" ]; then
              echo "::warning::Candidate open WinGet PR $pr_url is missing head repository or commit metadata."
              return 1
            fi
            changed_files="$(gh api --paginate "repos/microsoft/winget-pkgs/pulls/$pr_num/files" --jq '.[] | select(.status == "added" or .status == "modified") | .filename' 2>/dev/null)" || return 1
            if ! grep -Fxq -- "$INSTALLER_MANIFEST" <<< "$changed_files"; then
              echo "::warning::Candidate open WinGet PR $pr_url does not add or modify $INSTALLER_MANIFEST."
              return 1
            fi
            if verify_installer_manifest "$head_repo" "$head_sha"; then
              echo "Verified open WinGet PR targeting $DEFAULT_BRANCH with matching arm64 URL and SHA-256: $pr_url"
              return 0
            fi
            echo "::warning::Candidate open WinGet PR $pr_url does not match $INSTALLER_URL / $EXPECTED_SHA256."
            return 1
          }

          if verify_installer_manifest "microsoft/winget-pkgs" ""; then
            echo "Verified WinGet installer manifest on default branch: $INSTALLER_MANIFEST"
            exit 0
          fi

          if [ -n "$PR_NUMBER" ] && verify_open_pr "$PR_NUMBER"; then
            exit 0
          fi

          for attempt in 1 2 3; do
            mapfile -t OPEN_PRS < <(gh api graphql \
              -f query='query($q: String!) { search(first: 100, type: ISSUE, query: $q) { nodes { ... on PullRequest { number title state } } } }' \
              -f q="repo:microsoft/winget-pkgs is:pr is:open in:title $PACKAGE_ID $VERSION" \
              | jq -r --arg pkg "$PACKAGE_ID" --arg ver "$VERSION" '
                  .data.search.nodes[]
                  | select(.state == "OPEN")
                  | select([(.title // "") | splits("\\s+")] | (index($pkg) != null and index($ver) != null))
                  | .number
                ')
            for candidate in "${OPEN_PRS[@]}"; do
              if [ -n "$candidate" ] && verify_open_pr "$candidate"; then
                exit 0
              fi
            done
            if verify_installer_manifest "microsoft/winget-pkgs" ""; then
              echo "Verified WinGet installer manifest on default branch: $INSTALLER_MANIFEST"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 3
            fi
          done

          CLOSED_URL="$(gh api graphql \
            -f query='query($q: String!) { search(first: 100, type: ISSUE, query: $q) { nodes { ... on PullRequest { title url state } } } }' \
            -f q="repo:microsoft/winget-pkgs is:pr is:closed in:title $PACKAGE_ID $VERSION" \
            | jq -r --arg pkg "$PACKAGE_ID" --arg ver "$VERSION" '
                .data.search.nodes[]
                | select(.state == "CLOSED")
                | select([(.title // "") | splits("\\s+")] | (index($pkg) != null and index($ver) != null))
                | .url
              ' | head -n 1)"
          if [ -n "$CLOSED_URL" ]; then
            echo "::error::WinGet verification failed: no merged manifest at $INSTALLER_MANIFEST or open PR matching $INSTALLER_URL ($EXPECTED_SHA256). A closed PR ($CLOSED_URL) may have caused Komac to skip submission."
          else
            echo "::error::WinGet verification failed: neither default branch ($INSTALLER_MANIFEST) nor any open PR matches $INSTALLER_URL ($EXPECTED_SHA256)."
          fi
          exit 1
