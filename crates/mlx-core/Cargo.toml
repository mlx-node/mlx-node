[package]
name = "mlx-core"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["full"]
full = [
  "dep:mlx-paged-attn",
  "dep:mlx-db",
  "dep:sqlx",
  "dep:parquet",
  "dep:mimalloc-safe",
  "dep:rust_xlsxwriter",
  "dep:tracing-subscriber",
  "napi/tokio_fs",
  "tokio/rt-multi-thread",
]
# Minimal feature set for browser/WASM builds (inference only)
browser = []
mimalloc-safe = ["dep:mimalloc-safe"]

[dependencies]
futures = { workspace = true }
half = { workspace = true }
libc = { workspace = true }
mlx-sys = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokenizers = { workspace = true }
minijinja = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
unicode-width = { workspace = true }
zip = { workspace = true }
image = { workspace = true }

# Optional deps (excluded in browser builds via --no-default-features)
parquet = { workspace = true, optional = true }
mlx-paged-attn = { workspace = true, optional = true }
mlx-db = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
rust_xlsxwriter = { workspace = true, optional = true }
mimalloc-safe = { workspace = true, features = ["skip_collect_on_exit", "v3"], optional = true }

[dev-dependencies]
criterion = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

[[bench]]
name = "attention_vjp_bench"
harness = false
