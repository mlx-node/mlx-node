[package]
name = "mlx-core"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures = { workspace = true }
half = { workspace = true }
libc = { workspace = true }
memchr = { workspace = true }
mlx-sys = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }
parquet = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
minijinja = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
image = { workspace = true }
mlx-paged-attn = { workspace = true }
mlx-db = { workspace = true }
mlx-tts = { workspace = true }
mlx-audio = { workspace = true }
mlx-clairic = { workspace = true }
sqlx = { workspace = true }
unicode-width = { workspace = true }
unicode-ident = { workspace = true }
rust_xlsxwriter = { workspace = true }
zip = { workspace = true }
unicode-normalization.workspace = true

[dependencies.mimalloc-safe]
workspace = true
features = ["skip_collect_on_exit", "v3"]

[dev-dependencies]
criterion = { workspace = true }
mlx-paged-attn = { workspace = true, features = ["test-hooks"] }

[build-dependencies]
cc = { workspace = true }
napi-build = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
mlx_metal = { package = "mlx-metal", path = "../mlx-metal" }

[target.'cfg(not(windows))'.dependencies]
tokenizers = { workspace = true, features = ["esaxx_fast"] }

[target.'cfg(windows)'.dependencies]
# esaxx_fast forces the static MSVC CRT. The pure Rust trainer works with Node's DLL CRT.
tokenizers = { workspace = true }
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[[bench]]
name = "attention_vjp_bench"
harness = false
