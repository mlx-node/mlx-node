[package]
name = "mlx-paged-attn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "PagedAttention for MLX-Node - efficient KV cache management with Metal kernels"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
mlx-sys.workspace = true
hashlink = "0.11"
libc.workspace = true
safetensors = "0.8"
sha2 = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
metal = { package = "mlx-metal", path = "../mlx-metal" }
tracing.workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "prefix_cache_lru_bench"
harness = false
