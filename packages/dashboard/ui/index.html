<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mlx-node Control Panel</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        background: #101014;
        color: #d7d7df;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .mlx-boot {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 14px;
        height: 100%;
        justify-content: center;
        letter-spacing: 0.01em;
      }

      .mlx-boot__spinner {
        animation: mlx-boot-spin 0.8s linear infinite;
        border: 2px solid rgba(215, 215, 223, 0.2);
        border-radius: 50%;
        border-top-color: #8aa4ff;
        height: 26px;
        width: 26px;
      }

      @keyframes mlx-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mlx-boot__spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="mlx-boot" role="status" aria-live="polite">
        <span class="mlx-boot__spinner" aria-hidden="true"></span>
        <span>Starting mlx-node…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
