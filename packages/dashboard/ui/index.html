<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>mlx-node Control Panel</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        background: light-dark(#ffffff, #141414);
        color: light-dark(#585858, #b4b4b4);
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      .mlx-boot {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100%;
        justify-content: center;
      }

      .mlx-boot__spinner {
        animation: mlx-boot-spin 0.8s linear infinite;
        border: 2px solid color-mix(in oklab, currentColor 22%, transparent);
        border-radius: 50%;
        border-top-color: currentColor;
        height: 22px;
        width: 22px;
      }

      @keyframes mlx-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mlx-boot__spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="mlx-boot" role="status" aria-live="polite">
        <span class="mlx-boot__spinner" aria-hidden="true"></span>
        <span>Starting mlx-node…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
